name: Bug report
description: Report reproducible broken behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include real player names or private session data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start a tournament with…"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Phone, Tablet, Desktop]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed real player names and private information.
          required: true
