name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm run vinext:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:lines
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Quick share visual regression
        run: |
          npm run start > /tmp/pickle-king-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:3000
          npm run test:share-visual
