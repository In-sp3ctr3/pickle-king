<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#090b08" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pickle King · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #090b08;
        color: #f5f3e9;
      }
      main {
        width: min(36rem, calc(100% - 2.5rem));
      }
      p:first-child {
        color: #c8ff3d;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.5rem 0;
        font-size: clamp(3rem, 13vw, 7rem);
        line-height: 0.85;
        text-transform: uppercase;
      }
      p:last-child {
        color: #9da494;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Offline courtside</p>
      <h1>Still in play.</h1>
      <p>
        Reopen Pickle King from your installed app or retry this page. Saved
        tournaments and scores remain on this device.
      </p>
    </main>
  </body>
</html>
